# ==========================================================
# PRODUCTION PROFILE (application-prod.properties)
# Active on Server / Docker: SPRING_PROFILES_ACTIVE=prod
# ==========================================================

# Database Configuration (Production DB from env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Production)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mail / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:thestoryceller@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${SPRING_MAIL_FROM:thestoryceller@gmail.com}

# Razorpay Payment Gateway (Production Live/Test Keys)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# System Admin Credentials
admin.email=${ADMIN_EMAIL:admin@storyceller.in}
admin.password=${ADMIN_PASSWORD:admin123}

# Server Port
server.port=${PORT:8080}

# CORS Configuration (Production Domains)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://thestoryceller.in,https://www.thestoryceller.in,https://the-story-celler.netlify.app}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
