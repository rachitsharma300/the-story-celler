spring.application.name=storyceller-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/storyceller?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:parsuram}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mail / SMTP Configuration for Gmail OTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:thestoryceller@gmail.com}
# NOTE: Requires Google App Password (16 characters from Google Account Security settings)
spring.mail.password=${SPRING_MAIL_PASSWORD:} 
# ysnodrzeseicpice
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.from=${SPRING_MAIL_FROM:thestoryceller@gmail.com}

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# System Admin Initialization Credentials
admin.email=${ADMIN_EMAIL:admin@storyceller.in}
admin.password=${ADMIN_PASSWORD:admin123}

# Server Port
server.port=8080

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://the-story-celler.netlify.app,https://thestoryceller.in,https://www.thestoryceller.in,https://thestoryceller.com,https://www.thestoryceller.com}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

